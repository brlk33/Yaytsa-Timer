<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Яйцетаймер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar" id="titlebar">
    <div class="tb-edge" data-hit="12"></div>
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="eggG" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#fff7ea"/><stop offset="1" stop-color="#f1d8b6"/></linearGradient>
          </defs>
          <path d="M16 3.5c-5.6 0-10 8.4-10 15 0 5.6 4.4 10 10 10s10-4.4 10-10c0-6.6-4.4-15-10-15z" fill="url(#eggG)"/>
          <circle cx="16" cy="19" r="5.6" fill="none" stroke="#e8743b" stroke-width="2.2"/>
          <path d="M16 15.9V19l2.1 1.4" fill="none" stroke="#e8743b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-name" data-i18n="appName">Яйцетаймер</span>
      <span class="brand-status" id="tbStatus" hidden></span>
    </div>
    <div class="win-btns">
      <button class="win-btn" id="winMin" data-i18n-title="winMin"><svg viewBox="0 0 12 12"><path d="M2 6.5h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      <button class="win-btn" id="winMax" data-i18n-title="winMax"><svg class="i-max" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><svg class="i-restore" viewBox="0 0 12 12"><rect x="1.8" y="3.8" width="6.4" height="6.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 2.2h4.2A1.8 1.8 0 0 1 10 4v4.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      <button class="win-btn close" id="winClose" data-i18n-title="winClose"><svg viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="timer" data-i18n="tabTimer"></button>
    <button class="tab" data-view="projects" data-i18n="tabProjects"></button>
    <button class="tab" data-view="apps" data-i18n="tabApps" data-desktop></button>
    <button class="tab" data-view="stats" data-i18n="tabStats"></button>
    <button class="tab" data-view="settings" data-i18n="tabSettings"></button>
  </nav>

  <main>
    <!-- TIMER -->
    <section class="view active" id="view-timer">
      <div class="phase-row">
        <span class="tag" id="phaseTag"></span>
        <span class="muted" id="cycleInfo"></span>
      </div>

      <div class="time" id="time">25:00</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>

      <div class="controls">
        <button class="icon-btn" id="btnReset" data-i18n-title="reset">
          <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 3.6v4.8h4.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="primary" id="btnStart"></button>
        <button class="icon-btn" id="btnSkip" data-i18n-title="skip">
          <svg viewBox="0 0 24 24"><path d="M6 5.2v13.6a.8.8 0 0 0 1.25.66l9.9-6.8a.8.8 0 0 0 0-1.32l-9.9-6.8A.8.8 0 0 0 6 5.2z" fill="currentColor"/><path d="M19 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="label-wrap" data-c="label">
        <input class="label-input" id="label" maxlength="120" data-i18n-ph="labelPh" autocomplete="off" spellcheck="false">
        <div class="suggest" id="labelSuggest" hidden></div>
      </div>
      <div class="label-meta" id="labelMeta" data-c="meta"></div>

      <div class="props">
        <div class="prop" data-p="work">
          <div class="prop-key">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 8v3.2l2 1.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-i18n="work"></span>
          </div>
          <div class="stepper" data-key="work"></div>
        </div>
        <div class="prop" data-p="brk">
          <div class="prop-key">
            <svg viewBox="0 0 20 20"><path d="M4 8h9v3.5A3.5 3.5 0 0 1 9.5 15h-2A3.5 3.5 0 0 1 4 11.5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 9h1.2a1.8 1.8 0 0 1 0 3.6H13" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 3.5v2M10 3.5v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-i18n="break"></span>
          </div>
          <div class="stepper" data-key="brk"></div>
        </div>
        <div class="prop" data-p="today">
          <div class="prop-key">
            <svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-i18n="today"></span>
          </div>
          <div class="prop-val" id="todayVal"></div>
        </div>
      </div>

      <div class="test-row" data-c="test"><button class="ghost small-btn" id="btnTest" data-i18n="test"></button></div>
    </section>

    <!-- PROJECTS -->
    <section class="view" id="view-projects">
      <h1 data-i18n="tabProjects"></h1>
      <p class="lead" data-i18n="projLead"></p>
      <form class="add-row" id="projAdd">
        <input class="text-input" id="projName" maxlength="120" data-i18n-ph="projNewPh" autocomplete="off">
        <button class="ghost" type="submit" data-i18n="add"></button>
      </form>
      <div id="projList"></div>
      <button class="ghost wide" id="btnHidden"></button>
      <div id="projHidden" hidden></div>
    </section>

    <!-- APPS -->
    <section class="view" id="view-apps">
      <h1 data-i18n="tabApps"></h1>
      <p class="lead" data-i18n="appsLead"></p>
      <div id="appList"></div>
      <button class="ghost wide add-app" id="btnAddApp" data-i18n="appsAdd"></button>
      <div class="picker" id="appPicker" hidden>
        <div class="picker-head"><h3 data-i18n="appsPickTitle"></h3><button class="ghost" id="btnPickClose" data-i18n="done"></button></div>
        <label class="search">
          <svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.8 12.8l3.7 3.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="appSearch" autocomplete="off" spellcheck="false" data-i18n-ph="appsSearchPh">
        </label>
        <div class="cand-list" id="appCandidates"></div>
        <button class="ghost wide browse" id="btnBrowse" data-i18n="appsBrowse"></button>
      </div>
    </section>

    <!-- STATS -->
    <section class="view" id="view-stats">
      <h1 data-i18n="tabStats"></h1>

      <div class="cards">
        <div class="card"><div class="card-label" data-i18n="today"></div><div class="card-val" id="stToday"></div></div>
        <div class="card"><div class="card-label" data-i18n="last7"></div><div class="card-val" id="stWeek"></div></div>
        <div class="card"><div class="card-label" data-i18n="last30"></div><div class="card-val" id="stMonth"></div></div>
      </div>

      <div class="goal" id="goalBlock">
        <div class="goal-head"><span data-i18n="goal"></span><span class="muted" id="goalText"></span></div>
        <div class="bar"><div class="bar-fill" id="goalFill"></div></div>
      </div>

      <div class="chart-head">
        <h2 data-i18n="byDay"></h2>
        <div class="chart-tools">
          <div class="seg small" id="chartRange">
            <button data-range="7">7</button><button data-range="14">14</button><button data-range="30">30</button>
          </div>
          <div class="seg small" id="heatRange">
            <button data-range="13" data-i18n="r3m"></button><button data-range="26" data-i18n="r6m"></button><button data-range="53" data-i18n="r1y"></button>
          </div>
          <div class="seg small icons" id="chartMode">
            <button data-mode="bars" data-i18n-title="modeBars"><svg viewBox="0 0 16 16"><path d="M3 13V8M8 13V3M13 13V6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            <button data-mode="squares" data-i18n-title="modeSquares"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1.3" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1.3" fill="currentColor" opacity=".55"/><rect x="2" y="9" width="5" height="5" rx="1.3" fill="currentColor" opacity=".35"/><rect x="9" y="9" width="5" height="5" rx="1.3" fill="currentColor"/></svg></button>
          </div>
        </div>
      </div>
      <div class="chart" id="chart"></div>
      <div class="heat" id="heat" hidden></div>

      <div class="hist-head">
        <h2 data-i18n="history"></h2>
        <div class="btn-row">
          <button class="ghost" id="btnImport" data-i18n="importCsv"></button>
          <button class="ghost" id="btnExport" data-i18n="exportCsv"></button>
        </div>
      </div>
      <div id="history"></div>
      <button class="ghost wide" id="btnMore" data-i18n="showMore"></button>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <h1 data-i18n="tabSettings"></h1>

      <div class="group-title" data-i18n="gTimer"></div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="workLen"></div><div class="set-desc" data-i18n="stepDesc"></div></div>
        <div class="stepper" data-key="work"></div>
      </div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="breakLen"></div><div class="set-desc" data-i18n="stepDesc"></div></div>
        <div class="stepper" data-key="brk"></div>
      </div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="autoStart"></div><div class="set-desc" data-i18n="autoStartDesc"></div></div>
        <button class="toggle" data-key="autoStart"></button>
      </div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="goalSet"></div><div class="set-desc" data-i18n="goalDesc"></div></div>
        <div class="stepper" data-key="goal"></div>
      </div>

      <div class="group-title" data-i18n="gNotify"></div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="popup"></div><div class="set-desc" data-i18n="popupDesc"></div></div>
        <button class="toggle" data-key="popup"></button>
      </div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="trayTest"></div></div>
        <button class="ghost" id="btnTest2" data-i18n="test"></button>
      </div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="sound"></div></div>
        <button class="toggle" data-key="sound"></button>
      </div>

      <div class="group-title" data-i18n="gLook"></div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="language"></div></div>
        <div class="seg" data-key="lang">
          <button data-val="ru">Русский</button><button data-val="en">English</button>
        </div>
      </div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="theme"></div></div>
        <div class="seg" data-key="theme">
          <button data-val="dark" data-i18n="dark"></button><button data-val="light" data-i18n="light"></button><button data-val="system" data-i18n="system"></button>
        </div>
      </div>
      <div class="group-title" data-i18n="gSystem" data-desktop></div>
      <div class="set" data-desktop>
        <div class="set-text"><div class="set-name" data-i18n="launchAtStart"></div><div class="set-desc" data-i18n="launchAtStartDesc"></div></div>
        <button class="toggle" id="autostartToggle"></button>
      </div>
      <div class="set" data-desktop>
        <div class="set-text"><div class="set-name" data-i18n="closeToTray"></div><div class="set-desc" data-i18n="closeToTrayDesc"></div></div>
        <button class="toggle" data-key="closeToTray"></button>
      </div>
      <div class="set" data-desktop>
        <div class="set-text"><div class="set-name" data-i18n="onTop"></div></div>
        <button class="toggle" data-key="alwaysOnTop"></button>
      </div>

      <div class="group-title" id="syncTitle"></div>
      <div id="syncBox"></div>

      <div class="group-title" data-i18n="gData"></div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="dataName"></div><div class="set-desc" data-i18n="dataDesc"></div></div>
        <div class="btn-row">
          <button class="ghost" id="btnImport2" data-i18n="importCsv"></button>
          <button class="ghost" id="btnExport2" data-i18n="exportCsv"></button>
          <button class="ghost" id="btnFolder" data-i18n="openFolder" data-desktop></button>
        </div>
      </div>
    </section>
  </main>

  <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  <div class="popover cal" id="cal" hidden></div>
  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="modal-btns"><button class="ghost" id="modalCancel"></button><button class="danger-btn" id="modalOk"></button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="update" id="update" hidden><span></span><button></button></div>

  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
