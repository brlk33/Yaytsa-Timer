<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Яйцетаймер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="splash" id="splash" data-android aria-hidden="true">
    <svg viewBox="0 0 256 256">
      <path class="sp-wave l" d="M34 116 Q18 150 34 184" style="transform-box: fill-box; transform-origin: 100% 50%"/>
      <path class="sp-wave r" d="M222 116 Q238 150 222 184" style="transform-box: fill-box; transform-origin: 0% 50%"/>
      <g class="sp-egg">
        <rect class="sp-cap" x="116" y="30" width="24" height="16" rx="5" fill="#D97757"/>
        <path d="M128 40 C 82 40, 54 108, 54 150 C 54 194, 87 222, 128 222 C 169 222, 202 194, 202 150 C 202 108, 174 40, 128 40 Z" fill="#FAF9F5"/>
        <circle cx="128" cy="152" r="53" fill="none" stroke="#37352F" stroke-opacity="0.12" stroke-width="5"/>
        <circle class="sp-sector" cx="128" cy="152" r="22" pathLength="100"/>
        <path class="sp-hand" d="M128 152 V 112" stroke="#37352F" stroke-width="7" stroke-linecap="round"/>
        <circle cx="128" cy="152" r="7" fill="#37352F"/>
      </g>
    </svg>
  </div>
  <header class="titlebar" id="titlebar">
    <div class="tb-edge" data-hit="12"></div>
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="eggG" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#fff7ea"/><stop offset="1" stop-color="#f1d8b6"/></linearGradient>
          </defs>
          <path d="M16 3.5c-5.6 0-10 8.4-10 15 0 5.6 4.4 10 10 10s10-4.4 10-10c0-6.6-4.4-15-10-15z" fill="url(#eggG)"/>
          <circle cx="16" cy="19" r="5.6" fill="none" stroke="#e8743b" stroke-width="2.2"/>
          <path d="M16 15.9V19l2.1 1.4" fill="none" stroke="#e8743b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-name" data-i18n="appName">Яйцетаймер</span>
      <span class="brand-status" id="tbStatus" hidden></span>
    </div>
    <div class="win-btns">
      <button class="win-btn" id="winMin" data-i18n-title="winMin"><svg viewBox="0 0 12 12"><path d="M2 6.5h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      <button class="win-btn" id="winMax" data-i18n-title="winMax"><svg class="i-max" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><svg class="i-restore" viewBox="0 0 12 12"><rect x="1.8" y="3.8" width="6.4" height="6.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 2.2h4.2A1.8 1.8 0 0 1 10 4v4.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      <button class="win-btn close" id="winClose" data-i18n-title="winClose"><svg viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="timer" data-i18n-title="tabTimer"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.6M9.5 2.8h5"/></svg><span data-i18n="tabTimer"></span></button>
    <button class="tab" data-view="projects" data-i18n-title="tabProjects"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span data-i18n="tabProjects"></span></button>
    <button class="tab" data-view="apps" data-i18n-title="tabApps" data-desktop><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg><span data-i18n="tabApps"></span></button>
    <button class="tab" data-view="stats" data-i18n-title="tabStats"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 19.5v-7M12 19.5V5M18.5 19.5v-10"/></svg><span data-i18n="tabStats"></span></button>
    <button class="tab" data-view="settings" data-i18n-title="tabSettings"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="tabSettings"></span></button>
  </nav>

  <main>
    <!-- TIMER -->
    <section class="view active" id="view-timer">
      <div class="face" id="face">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="ringWork" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d8bff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient>
            <linearGradient id="ringBreak" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fbf8f"/><stop offset="1" stop-color="#3db7d6"/></linearGradient>
          </defs>
          <circle class="ring-track" cx="50" cy="50" r="46"/>
          <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="46"/>
        </svg>
        <div class="phase-row">
          <span class="tag" id="phaseTag"></span>
          <span class="muted" id="cycleInfo"></span>
        </div>

        <div class="time" id="time">25:00</div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="face-today" id="faceToday" data-android></div>
      </div>

      <div class="controls">
        <button class="icon-btn" id="btnReset" data-i18n-title="reset">
          <svg viewBox="0 0 24 24"><path d="M10.7 4.6A7.5 7.5 0 1 1 4.95 9.43" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.2 2.1 10.7 4.6l2.6 2.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="primary" id="btnStart"></button>
        <button class="icon-btn" id="btnSkip" data-i18n-title="skip">
          <svg viewBox="0 0 24 24"><path d="M6 5.2v13.6a.8.8 0 0 0 1.25.66l9.9-6.8a.8.8 0 0 0 0-1.32l-9.9-6.8A.8.8 0 0 0 6 5.2z" fill="currentColor"/><path d="M19 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="label-wrap" data-c="label">
        <input class="label-input" id="label" maxlength="120" data-i18n-ph="labelPh" autocomplete="off" spellcheck="false">
        <div class="suggest" id="labelSuggest" hidden></div>
      </div>
      <div class="label-meta" id="labelMeta" data-c="meta"></div>

      <div class="dials" data-android>
        <div class="dial" data-key="work">
          <span class="dial-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.4 1.5M9.5 3h5"/></svg></span>
          <div class="wheel"><div class="wheel-col"></div></div>
          <span class="dial-unit"></span>
        </div>
        <div class="dial" data-key="brk">
          <span class="dial-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v4.5A4.5 4.5 0 0 1 11.5 18h-2A4.5 4.5 0 0 1 5 13.5z"/><path d="M16 10.5h1.2a2.2 2.2 0 0 1 0 4.4H16M8.5 4v2.5M12 4v2.5"/></svg></span>
          <div class="wheel"><div class="wheel-col"></div></div>
          <span class="dial-unit"></span>
        </div>
      </div>

      <div class="props">
        <div class="prop" data-p="work">
          <div class="prop-key">
            <svg viewBox="0 0 20 20"><circle cx="10" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 8v3.2l2 1.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-i18n="work"></span>
          </div>
          <div class="stepper" data-key="work"></div>
        </div>
        <div class="prop" data-p="brk">
          <div class="prop-key">
            <svg viewBox="0 0 20 20"><path d="M4 8h9v3.5A3.5 3.5 0 0 1 9.5 15h-2A3.5 3.5 0 0 1 4 11.5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 9h1.2a1.8 1.8 0 0 1 0 3.6H13" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 3.5v2M10 3.5v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-i18n="break"></span>
          </div>
          <div class="stepper" data-key="brk"></div>
        </div>
        <div class="prop" data-p="today">
          <div class="prop-key">
            <svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-i18n="today"></span>
          </div>
          <div class="prop-val" id="todayVal"></div>
        </div>
      </div>

      <div class="test-row" data-c="test"><button class="ghost small-btn" id="btnTest" data-i18n="test"></button></div>
    </section>

    <!-- PROJECTS -->
    <section class="view" id="view-projects">
      <h1 data-i18n="tabProjects"></h1>
      <p class="lead" data-i18n="projLead"></p>
      <form class="add-row" id="projAdd">
        <input class="text-input" id="projName" maxlength="120" data-i18n-ph="projNewPh" autocomplete="off">
        <button class="ghost add-btn" type="submit" data-i18n-title="add"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
      </form>
      <div id="projList"></div>
      <button class="ghost wide" id="btnHidden"></button>
      <div id="projHidden" hidden></div>
    </section>

    <!-- APPS -->
    <section class="view" id="view-apps">
      <h1 data-i18n="tabApps"></h1>
      <p class="lead" data-i18n="appsLead"></p>
      <div id="appList"></div>
      <button class="ghost wide add-app" id="btnAddApp" data-i18n="appsAdd"></button>
      <div class="picker" id="appPicker" hidden>
        <div class="picker-head"><h3 data-i18n="appsPickTitle"></h3><button class="ghost" id="btnPickClose" data-i18n="done"></button></div>
        <label class="search">
          <svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.8 12.8l3.7 3.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="appSearch" autocomplete="off" spellcheck="false" data-i18n-ph="appsSearchPh">
        </label>
        <div class="cand-list" id="appCandidates"></div>
        <button class="ghost wide browse" id="btnBrowse" data-i18n="appsBrowse"></button>
      </div>
    </section>

    <!-- STATS -->
    <section class="view" id="view-stats">
      <h1 data-i18n="tabStats"></h1>

      <div class="cards">
        <div class="card"><div class="card-label" data-i18n="today"></div><div class="card-val" id="stToday"></div></div>
        <div class="card"><div class="card-label" data-i18n="last7"></div><div class="card-val" id="stWeek"></div></div>
        <div class="card"><div class="card-label" data-i18n="last30"></div><div class="card-val" id="stMonth"></div></div>
      </div>

      <div class="goal" id="goalBlock">
        <div class="goal-head"><span data-i18n="goal"></span><span class="muted" id="goalText"></span></div>
        <div class="bar"><div class="bar-fill" id="goalFill"></div></div>
      </div>

      <div class="chart-head">
        <h2 data-i18n="byDay"></h2>
        <div class="chart-tools">
          <div class="seg small" id="chartRange">
            <button data-range="7">7</button><button data-range="14">14</button><button data-range="30">30</button>
          </div>
          <div class="seg small" id="heatRange">
            <button data-range="13" data-i18n="r3m"></button><button data-range="26" data-i18n="r6m"></button><button data-range="53" data-i18n="r1y"></button>
          </div>
          <div class="seg small icons" id="chartMode">
            <button data-mode="bars" data-i18n-title="modeBars"><svg viewBox="0 0 16 16"><path d="M3 13V8M8 13V3M13 13V6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
            <button data-mode="squares" data-i18n-title="modeSquares"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1.3" fill="currentColor"/><rect x="9" y="2" width="5" height="5" rx="1.3" fill="currentColor" opacity=".55"/><rect x="2" y="9" width="5" height="5" rx="1.3" fill="currentColor" opacity=".35"/><rect x="9" y="9" width="5" height="5" rx="1.3" fill="currentColor"/></svg></button>
          </div>
        </div>
      </div>
      <div class="chart" id="chart"></div>
      <div class="heat" id="heat" hidden></div>

      <div class="hist-head">
        <h2 data-i18n="history"></h2>
        <div class="btn-row">
          <button class="ghost with-ico" id="btnImport"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10.5M7.5 10 12 14.5 16.5 10M5 19.5h14"/></svg><span data-i18n="importCsv"></span></button>
          <button class="ghost with-ico" id="btnExport"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14.5V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/></svg><span data-i18n="exportCsv"></span></button>
        </div>
      </div>
      <div id="history"></div>
      <button class="ghost wide" id="btnMore" data-i18n="showMore"></button>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <h1 data-i18n="tabSettings"></h1>

      <div class="group-title" data-i18n="gTimer"></div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.4 1.5M9.5 3h5"/></svg></span><div class="set-text"><div class="set-name" data-i18n="workLen"></div><div class="set-desc" data-i18n="stepDesc"></div></div>
        <div class="stepper" data-key="work"></div>
      </div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v4.5A4.5 4.5 0 0 1 11.5 18h-2A4.5 4.5 0 0 1 5 13.5z"/><path d="M16 10.5h1.2a2.2 2.2 0 0 1 0 4.4H16M8.5 4v2.5M12 4v2.5"/></svg></span><div class="set-text"><div class="set-name" data-i18n="breakLen"></div><div class="set-desc" data-i18n="stepDesc"></div></div>
        <div class="stepper" data-key="brk"></div>
      </div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11a7 7 0 0 1 12-4.9L19 8M19 4v4h-4M19 13a7 7 0 0 1-12 4.9L5 16M5 20v-4h4"/></svg></span><div class="set-text"><div class="set-name" data-i18n="autoStart"></div><div class="set-desc" data-i18n="autoStartDesc"></div></div>
        <button class="toggle" data-key="autoStart"></button>
      </div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".9" fill="currentColor"/></svg></span><div class="set-text"><div class="set-name" data-i18n="goalSet"></div><div class="set-desc" data-i18n="goalDesc"></div></div>
        <div class="stepper" data-key="goal"></div>
      </div>

      <div class="group-title" data-i18n="gNotify"></div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></span><div class="set-text"><div class="set-name" data-i18n="popup"></div><div class="set-desc" data-i18n="popupDesc"></div></div>
        <button class="toggle" data-key="popup"></button>
      </div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg></span><div class="set-text"><div class="set-name" data-i18n="trayTest"></div></div>
        <button class="ghost" id="btnTest2" data-i18n="test"></button>
      </div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></span><div class="set-text"><div class="set-name" data-i18n="sound"></div></div>
        <button class="toggle" data-key="sound"></button>
      </div>
      <div class="set" data-android>
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3"/><circle cx="6.6" cy="17.5" r="2.4"/><circle cx="16.6" cy="15.3" r="2.4"/></svg></span><div class="set-text"><div class="set-name" data-i18n="alertSound"></div><div class="set-desc" id="soundName"></div></div>
        <button class="ghost with-ico" id="btnSound"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3"/><circle cx="6.6" cy="17.5" r="2.4"/><circle cx="16.6" cy="15.3" r="2.4"/></svg><span data-i18n="choose"></span></button>
      </div>

      <div class="group-title" data-i18n="gLook"></div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/></svg></span><div class="set-text"><div class="set-name" data-i18n="language"></div></div>
        <div class="seg" data-key="lang">
          <button data-val="ru">Русский</button><button data-val="en">English</button>
        </div>
      </div>
      <div class="set">
        <span class="set-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></span><div class="set-text"><div class="set-name" data-i18n="theme"></div></div>
        <div class="seg" data-key="theme">
          <button data-val="dark" data-i18n-title="dark"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></svg><span data-i18n="dark"></span></button><button data-val="light" data-i18n-title="light"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.8"/><path d="M12 3v1.8M12 19.2V21M3 12h1.8M19.2 12H21M5.6 5.6l1.3 1.3M17.1 17.1l1.3 1.3M5.6 18.4l1.3-1.3M17.1 6.9l1.3-1.3"/></svg><span data-i18n="light"></span></button><button data-val="system" data-i18n-title="system"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg><span data-i18n="system"></span></button>
        </div>
      </div>
      <div class="group-title" data-i18n="gSystem" data-desktop></div>
      <div class="set" data-desktop>
        <div class="set-text"><div class="set-name" data-i18n="launchAtStart"></div><div class="set-desc" data-i18n="launchAtStartDesc"></div></div>
        <button class="toggle" id="autostartToggle"></button>
      </div>
      <div class="set" data-desktop>
        <div class="set-text"><div class="set-name" data-i18n="closeToTray"></div><div class="set-desc" data-i18n="closeToTrayDesc"></div></div>
        <button class="toggle" data-key="closeToTray"></button>
      </div>
      <div class="set" data-desktop>
        <div class="set-text"><div class="set-name" data-i18n="onTop"></div></div>
        <button class="toggle" data-key="alwaysOnTop"></button>
      </div>

      <div class="group-title" id="syncTitle"></div>
      <div id="syncBox"></div>

      <div class="group-title" data-i18n="gData"></div>
      <div class="set">
        <div class="set-text"><div class="set-name" data-i18n="dataName"></div><div class="set-desc" data-i18n="dataDesc"></div></div>
        <div class="btn-row">
          <button class="ghost with-ico" id="btnImport2"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10.5M7.5 10 12 14.5 16.5 10M5 19.5h14"/></svg><span data-i18n="importCsv"></span></button>
          <button class="ghost with-ico" id="btnExport2"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14.5V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14"/></svg><span data-i18n="exportCsv"></span></button>
          <button class="ghost" id="btnFolder" data-i18n="openFolder" data-desktop></button>
        </div>
      </div>
    </section>
  </main>

  <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  <div class="popover cal" id="cal" hidden></div>
  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <div class="modal-btns"><button class="ghost" id="modalCancel"></button><button class="danger-btn" id="modalOk"></button></div>
    </div>
  </div>
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet"><h3 id="sheetTitle"></h3><div id="sheetItems"></div><button class="sheet-cancel" id="sheetCancel" data-i18n="cancel"></button></div>
  </div>
  <div class="banner" id="syncBanner" hidden>
    <span class="banner-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h9.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 6.3 9.6 4.5 4.5 0 0 0 7 18.5z"/><path d="M4 4l16 16"/></svg></span>
    <span class="banner-text" id="syncBannerText"></span>
    <button class="banner-go" id="syncBannerGo"></button>
    <button class="banner-x" id="syncBannerX" aria-label="×"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
  <div class="toast" id="toast"></div>
  <div class="update" id="update" hidden><span></span><button></button></div>

  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
