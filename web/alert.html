<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Яйцетаймер</title>
  <style>
    :root {
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
      --bg: #202020; --border: rgba(255,255,255,0.1); --text: rgba(255,255,255,0.92); --text-2: rgba(255,255,255,0.5);
      --hover: rgba(255,255,255,0.07); --accent: #2383e2; --accent-h: #0077d4; --break: #4dab9a;
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --border: rgba(55,53,47,0.14); --text: rgb(37,35,30); --text-2: rgba(55,53,47,0.6);
      --hover: rgba(55,53,47,0.07); --break: #448361;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: var(--font); user-select: none; }
    .card {
      position: absolute; inset: 0;
      background: var(--bg); color: var(--text);

      padding: 16px 16px 14px;
      display: flex; flex-direction: column;
      animation: slide .28s cubic-bezier(.2,.8,.2,1);
    }
    .card.nudge { animation: nudge .5s ease; }
    .card[hidden] { display: none; }
    @keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes nudge { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
    .top { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 0 0 currentColor; animation: pulse 1.6s infinite; color: var(--accent); }
    .dot.break { background: var(--break); color: var(--break); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 55%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    .title { font-size: 16px; font-weight: 600; line-height: 1.3; }
    .since { margin-left: auto; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .body { margin: 6px 0 0 20px; font-size: 13px; color: var(--text-2); line-height: 1.45; }
    .btns { display: flex; gap: 8px; margin-top: auto; padding-top: 14px; }
    button {
      flex: 1; height: 34px; border: 0; border-radius: 6px;
      font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .primary { background: var(--accent); color: #fff; }
    .primary:hover { background: var(--accent-h); }
    .primary.break { background: var(--break); }
    .primary.break:hover { filter: brightness(0.92); }
    .ghost { background: var(--hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); flex: 0 0 auto; padding: 0 14px; }
    .ghost:hover { filter: brightness(1.2); }
  </style>
</head>
<body>
  <div class="card" id="card" hidden>
    <div class="top"><span class="dot" id="dot"></span><span class="title" id="title"></span><span class="since" id="since"></span></div>
    <div class="body" id="body"></div>
    <div class="btns">
      <button class="primary" id="go"></button>
      <button class="ghost" id="ok"></button>
    </div>
  </div>
  <script src="alert.js"></script>
</body>
</html>
