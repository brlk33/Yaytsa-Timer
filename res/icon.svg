<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Яйцетаймер brand mark: a white egg with a timer dial on the app's violet gradient.
       One bold shape, so it still reads at 16 px. Rendered to res/app.ico and the site PNG. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a8dff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#sheen)"/>
  <!-- egg with a round dial cut out -->
  <path fill="#fff" fill-rule="evenodd" d="M512 196C384 196 268 392 268 552c0 152 108 276 244 276s244-124 244-276C756 392 640 196 512 196zM512 418a148 148 0 1 1 0 296a148 148 0 1 1 0-296z"/>
  <!-- the time left: a quarter of the dial -->
  <path fill="#fff" d="M512 566V452a114 114 0 0 1 114 114z"/>
</svg>
